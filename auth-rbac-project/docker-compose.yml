version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  # You can add frontend later if needed
  # frontend:
  #   build: ./client
  #   ports:
  #     - "5173:5173"