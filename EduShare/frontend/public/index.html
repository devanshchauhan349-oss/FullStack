<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduShare - Share Knowledge, Inspire Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dark { background-color: #1a1a1a; color: #ffffff; }
        .dark .bg-white { background-color: #2d2d2d !important; }
        .dark .text-gray-800, .dark .text-gray-900 { color: #ffffff !important; }
        .dark .text-gray-600 { color: #b3b3b3 !important; }
        .dark .border-gray-200 { border-color: #404040 !important; }
        .dark .bg-gray-50 { background-color: #1a1a1a !important; }
        .dark .shadow-md, .dark .shadow-lg { box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important; }
        .transition-all { transition: all 0.3s ease; }
        .resource-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
